<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - SMS Simbtech</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      img { width: 96px; height: 96px; margin-bottom: 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; color: #1d4ed8; }
      p { margin: 0 0 20px; color: #475569; max-width: 420px; line-height: 1.5; }
      button {
        background: #1d4ed8;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 15px;
        cursor: pointer;
      }
      button:hover { background: #1e40af; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/icons/icon-192.png" alt="SMS Simbtech" />
      <h1>You're offline</h1>
      <p>
        SMS Simbtech needs an internet connection to load this page. Please
        check your connection and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
